<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FounderFlow" />
  <meta name="theme-color" content="#FBF8F3" />
  <title>FounderFlow — Working Mom & Business Planner</title>

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23C86D51'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%23FBF8F3' stroke-width='12' stroke-dasharray='240 90' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='90' r='14' fill='%23FBF8F3'/%3E%3C/svg%3E" />

  <style>
    :root {
      --bg: #FBF8F3;
      --surface: #FFFFFF;
      --surface-warm: #F4EFE6;
      --text: #2C2724;
      --text-muted: #786E67;
      --terracotta: #C86D51;
      --terracotta-soft: #F7E7E1;
      --sage: #5E7A68;
      --sage-soft: #E5EDE8;
      --ochre: #C9963E;
      --ochre-soft: #F9F0DF;
      --slate: #5A6B7C;
      --slate-soft: #E8EDF2;
      --border: #E6DFD5;
      --shadow: 0 4px 16px rgba(44, 39, 36, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: calc(95px + env(safe-area-inset-bottom));
      padding-top: env(safe-area-inset-top);
      max-width: 540px;
      margin: 0 auto;
    }

    header {
      padding: 18px 20px 12px;
      position: sticky;
      top: 0;
      background: rgba(251, 248, 243, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
      border-bottom: 1px solid var(--border);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .greeting h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .greeting p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pill-btn.active {
      background: var(--ochre);
      color: #fff;
      border-color: var(--ochre);
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .status-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .progress-track {
      height: 6px;
      background: var(--surface-warm);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: var(--terracotta);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .energy-fill {
      background: var(--sage);
    }

    .view {
      display: none;
      padding: 16px 20px;
    }

    .view.active {
      display: block;
    }

    .founder-zone-banner {
      background: linear-gradient(135deg, var(--terracotta-soft), #FDF5F2);
      border: 1px dashed var(--terracotta);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .founder-zone-banner strong {
      font-size: 0.88rem;
      color: var(--terracotta);
      display: block;
    }

    .founder-zone-banner span {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 5px solid var(--sage);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .task-card.cat-business {
      border-left-color: var(--terracotta);
      background: #FFFCFA;
    }

    .task-card.cat-family {
      border-left-color: var(--ochre);
    }

    .task-card.cat-self {
      border-left-color: var(--slate);
    }

    .task-card.done {
      opacity: 0.55;
    }

    .task-card.done .task-title {
      text-decoration: line-through;
    }

    .task-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #fff;
      font-size: 0.85rem;
      color: #fff;
    }

    .task-card.done .check-circle {
      background: var(--sage);
      border-color: var(--sage);
    }

    .task-card.cat-business.done .check-circle {
      background: var(--terracotta);
      border-color: var(--terracotta);
    }

    .task-main {
      flex: 1;
      min-width: 0;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }

    .time-badge {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-warm);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .cat-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .tag-business { background: var(--terracotta-soft); color: var(--terracotta); }
    .tag-family { background: var(--ochre-soft); color: #9A6D1F; }
    .tag-self { background: var(--slate-soft); color: var(--slate); }

    .energy-dots {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .task-title {
      font-size: 1rem;
      font-weight: 650;
      margin-bottom: 6px;
      word-wrap: break-word;
    }

    .subtasks {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .subtask-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .subtask-item.sub-done {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .mini-btn {
      background: var(--surface-warm);
      border: none;
      color: var(--text);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-btn.focus-trigger {
      background: var(--terracotta);
      color: #fff;
    }

    .dump-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .dump-box input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.95rem;
      color: var(--text);
    }

    .primary-btn {
      background: var(--terracotta);
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .template-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .template-card h3 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .template-card p {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 12px;
    }

    .nav-btn span.icon {
      font-size: 1.25rem;
    }

    .nav-btn.active {
      color: var(--terracotta);
    }

    .fab-add {
      background: var(--terracotta);
      color: #fff;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(200, 109, 81, 0.4);
      cursor: pointer;
      margin-top: -12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(44, 39, 36, 0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--bg);
      width: 100%;
      max-width: 540px;
      border-radius: 24px 24px 0 0;
      padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-sheet h2 {
      font-size: 1.15rem;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.95rem;
      color: var(--text);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .focus-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));
      text-align: center;
    }

    .focus-overlay.open {
      display: flex;
    }

    .ring-wrap {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-wrap svg {
      transform: rotate(-90deg);
      width: 250px;
      height: 250px;
    }

    .ring-time {
      position: absolute;
      font-size: 2.7rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .focus-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 340px;
    }

    .focus-controls button {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-row">
      <div class="greeting">
        <h1 id="dateHeader">Today's Flow</h1>
        <p id="subGreeting">10:00 AM – 2:00 PM Founder Window · Pickup 2:40 PM</p>
      </div>
      <div class="header-actions">
        <button class="pill-btn" id="wedToggle" onclick="toggleShortDay()">Wed 12:40</button>
        <button class="pill-btn" onclick="sweepUnfinished()">Sweep</button>
      </div>
    </div>

    <div class="status-grid">
      <div class="status-card">
        <div class="status-label">
          <span id="founderTargetLabel">Founder 4h</span>
          <span id="founderHoursText">0 / 4.0h</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="founderBar" style="width: 0%"></div>
        </div>
      </div>
      <div class="status-card">
