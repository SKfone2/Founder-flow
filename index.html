<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FounderFlow" />
  <meta name="theme-color" content="#FBF8F3" />
  <title>FounderFlow — Working Mom & Creative Project Planner</title>

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23C86D51'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%23FBF8F3' stroke-width='12' stroke-dasharray='240 90' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='90' r='14' fill='%23FBF8F3'/%3E%3C/svg%3E" />

  <style>
    :root {
      --bg: #FBF8F3;
      --surface: #FFFFFF;
      --surface-warm: #F4EFE6;
      --text: #2C2724;
      --text-muted: #786E67;
      --terracotta: #C86D51;
      --terracotta-soft: #F7E7E1;
      --sage: #5E7A68;
      --sage-soft: #E5EDE8;
      --ochre: #C9963E;
      --ochre-soft: #F9F0DF;
      --plum: #8A5A75;
      --plum-soft: #F4E8EF;
      --slate: #5A6B7C;
      --slate-soft: #E8EDF2;
      --border: #E6DFD5;
      --shadow: 0 4px 16px rgba(44, 39, 36, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: calc(95px + env(safe-area-inset-bottom));
      padding-top: env(safe-area-inset-top);
      max-width: 540px;
      margin: 0 auto;
    }

    header {
      padding: 16px 18px 12px;
      position: sticky;
      top: 0;
      background: rgba(251, 248, 243, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
      border-bottom: 1px solid var(--border);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 6px;
    }

    .greeting h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .greeting p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .pill-btn.salvage-pill {
      background: var(--terracotta);
      color: #fff;
      border-color: var(--terracotta);
    }

    .pill-btn.active-wed {
      background: var(--ochre);
      color: #fff;
      border-color: var(--ochre);
    }

    .pill-btn.active-break {
      background: var(--sage);
      color: #fff;
      border-color: var(--sage);
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr 0.9fr;
      gap: 8px;
      margin-top: 6px;
    }

    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 7px 10px;
    }

    .status-label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .progress-track {
      height: 6px;
      background: var(--surface-warm);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-fill {
      height: 100%;
      background: var(--terracotta);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .energy-fill {
      background: var(--sage);
    }

    .fun-fill {
      background: var(--plum);
    }

    .view {
      display: none;
      padding: 16px 18px;
    }

    .view.active {
      display: block;
    }

    /* Up Next Right Now Spotlight Card */
    .now-spotlight {
      background: linear-gradient(135deg, #2C2724, #423A35);
      color: #FBF8F3;
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .now-spotlight .now-eyebrow {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #E7B8A8;
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
    }

    .now-spotlight .now-title {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .now-spotlight .now-meta {
      font-size: 0.76rem;
      color: #D2C8C0;
      margin-top: 3px;
    }

    .now-start-btn {
      background: var(--terracotta);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .founder-zone-banner {
      background: linear-gradient(135deg, var(--terracotta-soft), #FDF5F2);
      border: 1px dashed var(--terracotta);
      border-radius: var(--radius);
      padding: 11px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .founder-zone-banner.break-banner {
      background: linear-gradient(135deg, var(--sage-soft), #F4F8F6);
      border-color: var(--sage);
    }

    .founder-zone-banner strong {
      font-size: 0.85rem;
      color: var(--terracotta);
      display: block;
    }

    .founder-zone-banner.break-banner strong {
      color: var(--sage);
    }

    .founder-zone-banner span {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 5px solid var(--sage);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .task-card.cat-business {
      border-left-color: var(--terracotta);
      background: #FFFCFA;
    }

    .task-card.cat-family {
      border-left-color: var(--ochre);
    }

    .task-card.cat-fun {
      border-left-color: var(--plum);
      background: #FDF9FC;
    }

    .task-card.cat-errand {
      border-left-color: var(--slate);
    }

    .task-card.cat-self {
      border-left-color: var(--sage);
    }

    .task-card.done {
      opacity: 0.52;
    }

    .task-card.done .task-title {
      text-decoration: line-through;
    }

    .task-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #fff;
      font-size: 0.85rem;
      color: #fff;
    }

    .task-card.done .check-circle {
      background: var(--sage);
      border-color: var(--sage);
    }

    .task-card.cat-business.done .check-circle {
      background: var(--terracotta);
      border-color: var(--terracotta);
    }

    .task-card.cat-fun.done .check-circle {
      background: var(--plum);
      border-color: var(--plum);
    }

    .task-main {
      flex: 1;
      min-width: 0;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }

    .time-badge {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-warm);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .cat-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .tag-business { background: var(--terracotta-soft); color: var(--terracotta); }
    .tag-family { background: var(--ochre-soft); color: #9A6D1F; }
    .tag-fun { background: var(--plum-soft); color: var(--plum); }
    .tag-errand { background: var(--slate-soft); color: var(--slate); }
    .tag-self { background: var(--sage-soft); color: var(--sage); }

    .energy-dots {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .task-title {
      font-size: 1rem;
      font-weight: 650;
      margin-bottom: 6px;
      word-wrap: break-word;
    }

    .subtasks {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .subtask-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text);
    }

    .subtask-left {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex: 1;
    }

    .subtask-item.sub-done .subtask-left {
      text-decoration: line-through;
      opacity: 0.55;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .mini-btn {
      background: var(--surface-warm);
      border: none;
      color: var(--text);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-btn.focus-trigger {
      background: var(--terracotta);
      color: #fff;
    }

    .mini-btn.fun-trigger {
      background: var(--plum);
      color: #fff;
    }

    .mini-btn.sage-trigger {
      background: var(--sage);
      color: #fff;
    }

    .filter-bar {
      display: flex
